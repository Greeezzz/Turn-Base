<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Turn-Based Fight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: backgroundShift 15s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes backgroundShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .game-container {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.98), rgba(240, 240, 255, 0.95));
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.3);
            max-width: 1000px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
            font-size: 3em;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 2px 2px 20px rgba(102, 126, 234, 0.3);
            animation: titlePulse 3s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .battle-arena {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 50px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 25px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
        }

        .character {
            flex: 1;
            text-align: center;
            position: relative;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.8), rgba(240, 240, 255, 0.6));
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .character:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }

        .character-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 15px 40px rgba(240, 147, 251, 0.5), 0 0 0 5px rgba(255, 255, 255, 0.5);
            transition: all 0.4s ease;
            overflow: hidden;
            border: 5px solid white;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .character-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .character-img.player2 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 15px 40px rgba(79, 172, 254, 0.5), 0 0 0 5px rgba(255, 255, 255, 0.5);
            animation-delay: -1.5s;
        }

        .character-img:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 20px 50px rgba(240, 147, 251, 0.7), 0 0 0 5px rgba(255, 255, 255, 0.8);
        }

        .character-img.player2:hover {
            box-shadow: 0 20px 50px rgba(79, 172, 254, 0.7), 0 0 0 5px rgba(255, 255, 255, 0.8);
        }

        .character-name {
            font-size: 2em;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hp-container {
            background: linear-gradient(to right, #e0e0e0, #f5f5f5);
            height: 35px;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px auto;
            max-width: 280px;
            position: relative;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.15), 0 2px 5px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .hp-bar {
            height: 100%;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 50%, #a8e063 100%);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(56, 239, 125, 0.6);
            position: relative;
            overflow: hidden;
        }

        .hp-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .hp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 900;
            font-size: 0.95em;
            color: #222;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.9), -1px -1px 3px rgba(255, 255, 255, 0.9);
            z-index: 10;
        }

        .vs {
            font-size: 4em;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
            animation: vsGlow 2s ease-in-out infinite;
            position: relative;
        }

        @keyframes vsGlow {
            0%, 100% { 
                transform: scale(1) rotate(0deg);
                filter: drop-shadow(0 5px 15px rgba(255, 107, 107, 0.5));
            }
            50% { 
                transform: scale(1.15) rotate(5deg);
                filter: drop-shadow(0 8px 25px rgba(255, 107, 107, 0.8));
            }
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 14px 30px;
            font-size: 1.15em;
            font-weight: 900;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        .attack-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .attack-btn:hover {
            background: linear-gradient(135deg, #f5576c 0%, #d63447 100%);
        }

        .heal-btn {
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .heal-btn:hover {
            background: linear-gradient(135deg, #56ab2f 0%, #3d8b1f 100%);
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        button:active {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
        }

        .turn-indicator {
            background: linear-gradient(135deg, #ffd93d 0%, #ffb800 100%);
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: 900;
            color: #333;
            display: inline-block;
            margin: 15px auto;
            box-shadow: 0 6px 20px rgba(255, 217, 61, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.8);
            animation: turnPulse 1.5s ease-in-out infinite;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes turnPulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 6px 20px rgba(255, 217, 61, 0.5);
            }
            50% { 
                transform: scale(1.08);
                box-shadow: 0 8px 30px rgba(255, 217, 61, 0.8);
            }
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .game-over-content {
            background: linear-gradient(to bottom, #ffffff, #f0f0ff);
            padding: 60px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 3px rgba(255, 255, 255, 0.3);
            border: 5px solid rgba(255, 255, 255, 0.5);
            animation: scaleIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }

        @keyframes scaleIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .game-over-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .game-over-content h2 {
            font-size: 3.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            animation: winnerBounce 1s ease-in-out infinite;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
        }

        @keyframes winnerBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .game-over-content p {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 35px;
            color: #333;
            position: relative;
            z-index: 1;
        }

        .game-over-content p span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.3em;
            font-weight: 900;
        }

        .reset-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 50px;
            font-size: 1.4em;
            position: relative;
            z-index: 1;
            border: 3px solid rgba(255, 255, 255, 0.5);
        }

        .reset-btn:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>⚔️ Turn-Based Fight Game ⚔️</h1>
        
        <div class="battle-arena">
            <div class="character">
                <div class="character-img"><img src="img/cantarella.jpeg" alt="ubur ubur"></div>
                <div class="character-name">Cantarella</div>
                <div class="hp-container">
                    <div class="hp-bar" id="hp1" style="width: 100%;">
                        <span class="hp-text" id="hp1-text">100 / 100</span>
                    </div>
                </div>
                <div id="turn1" class="turn-indicator">Your Turn!</div>
                <div class="controls" id="controls1">
                    <button class="attack-btn" onclick="attack(pemain1, pemain2)">⚔️ Attack</button>
                    <button class="heal-btn" onclick="heal(pemain1)">❤️ Heal</button>
                </div>

                <!-- Inventory & equipped display -->
                <div style="margin-top:18px; text-align:center;">
                    <div style="font-weight:900; margin-bottom:6px;">Equipped: <span id="equipped1">None</span></div>
                    <div id="inventory1" style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;"></div>
                </div>
            </div>

            <div class="vs">VS</div>

            <div class="character">
                <div class="character-img player2"><img src="img/charlotta.jpeg" alt="yakult"></div>
                <div class="character-name">Charlotta</div>
                <div class="hp-container">
                    <div class="hp-bar" id="hp2" style="width: 100%;">
                        <span class="hp-text" id="hp2-text">100 / 100</span>
                    </div>
                </div>
                <div id="turn2" class="turn-indicator" style="display: none;">Your Turn!</div>
                <div class="controls" id="controls2">
                    <button class="attack-btn" onclick="attack(pemain2, pemain1)">⚔️ Attack</button>
                    <button class="heal-btn" onclick="heal(pemain2)">❤️ Heal</button>
                </div>

                <!-- Inventory & equipped display -->
                <div style="margin-top:18px; text-align:center;">
                    <div style="font-weight:900; margin-bottom:6px;">Equipped: <span id="equipped2">None</span></div>
                    <div id="inventory2" style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="game-over" id="game-over">
        <div class="game-over-content">
            <h2>🏆 GAME OVER! 🏆</h2>
            <p><span id="winner-name"></span> Menang!</p>
            <button class="reset-btn" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script src="lanjutan.js"></script>
</body>
</html>
